[project]
name = "workspace-graph"
version = "0.4.10"
description = "Multi-language workspace code graph orchestrator"
requires-python = ">=3.11"
authors = [{name = "Shivam Goel", email = "sg15rokz@gmail.com"}]
license = "MIT"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "mcp>=1.0",
    "pydantic>=2.0",
    "pathspec>=1.1.1",
    "orjson>=3.10",
]

[project.urls]
Homepage = "https://github.com/shvmgyl15/codegraph"
Repository = "https://github.com/shvmgyl15/codegraph"
Issues = "https://github.com/shvmgyl15/codegraph/issues"

[project.scripts]
codegraph = "codegraph.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/codegraph"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
exclude = ["tests/"]
disallow_any_unimported = true
disallow_any_decorated = true
disallow_subclassing_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --cov=codegraph --cov-report=term-missing"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.13",
]
